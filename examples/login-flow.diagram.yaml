type: flow
title: Login with optional MFA
direction: DOWN
nodes:
  - { id: start, label: User submits credentials, kind: start }
  - { id: check, label: Verify password, kind: process, description: Compares the hash with argon2id; the comparison is constant-time. }
  - { id: ok, label: Valid?, kind: decision }
  - { id: mfa, label: MFA enabled?, kind: decision }
  - { id: code, label: Ask for TOTP code, kind: process }
  - { id: session, label: Create session, kind: process }
  - { id: deny, label: Reject, kind: end }
  - { id: done, label: Access granted, kind: end }
edges:
  - { from: start, to: check }
  - { from: check, to: ok }
  - { from: ok, to: mfa, label: "yes", flow: true }
  - { from: ok, to: deny, label: "no", style: dashed }
  - { from: mfa, to: code, label: "yes" }
  - { from: mfa, to: session, label: "no", flow: true }
  - { from: code, to: session }
  - { from: session, to: done, flow: true }
notes:
  - { target: check, text: After 5 failed attempts the account is locked for 15 minutes. }
steps:
  - title: Verify credentials
    show: [start, check, ok]
  - title: Second factor
    show: [mfa, code, session]
  - title: Outcome
    show: [session, done, deny]
