name: ci
on:
  push:
    branches: [main]
  pull_request:

# least privilege: the workflow can only read the repository
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Build the demo site
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run demo:build

  # One stable check for branch protection: it passes only when every matrix job passed.
  required:
    name: required
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: All test jobs must succeed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test jobs: ${{ needs.test.result }}"
            exit 1
          fi
